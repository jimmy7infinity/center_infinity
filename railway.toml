# Vite SPA built to dist, served with the brief endpoint by server.mjs on
# Railway's $PORT. Optional env: RESEND_API_KEY, BRIEF_TO, BRIEF_FROM, BRIEFS_DIR.
[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm build"

[deploy]
startCommand = "pnpm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
